<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멜론님께 🍈</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1d1d1f;--ink-2:#3a3a3c;--mute:#86868b;--paper:#fbfaf7;--line:#e8e4dc;--ease:cubic-bezier(.22,.61,.36,1)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;background:var(--paper);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid #0071e3;outline-offset:3px}

  /* 시작 */
  .intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 8px}
  .intro .m{font-size:36px;line-height:1}
  .intro h1{margin-top:14px;font-size:clamp(40px,6vw,68px);font-weight:800;letter-spacing:-.05em;line-height:1.05}
  .intro p{margin-top:18px;font-size:clamp(18px,2.2vw,22px);color:var(--mute);line-height:1.6}
  .intro p b{color:var(--ink);font-weight:700}
  .intro .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:36px}
  .btn{border:0;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
  .btn.ghost{background:#ecebe6;color:var(--ink)}
  .intro .seq{opacity:0;transform:translateY(14px);transition:opacity 1.4s var(--ease),transform 1.4s var(--ease)}
  .intro .seq.in{opacity:1;transform:none}

  /* 섹션 머리 */
  .head{width:min(1200px,100%);margin:0 auto;padding:40px 24px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .head h2{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.1}
  .head span{font-size:16px;color:var(--mute)}

  /* 포스트잇 벽 */
  .wall{width:min(1200px,100%);margin:0 auto;padding:0 24px 90px;columns:4 240px;column-gap:22px}
  .pi{break-inside:avoid;display:block;width:100%;margin:0 0 22px;padding:22px 20px 16px;border:0;border-radius:4px 4px 20px 4px;text-align:left;cursor:zoom-in;
    box-shadow:0 1px 1px rgba(0,0,0,.05),0 12px 24px -10px rgba(0,0,0,.2);transition:transform .25s var(--ease),box-shadow .25s var(--ease);
    opacity:0;translate:0 18px}
  .pi.in{opacity:1;translate:0 0;transition:opacity .9s var(--ease),translate .9s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease)}
  .pi:hover{transform:rotate(0deg) scale(1.03)!important;box-shadow:0 2px 2px rgba(0,0,0,.05),0 20px 34px -12px rgba(0,0,0,.28)}
  .pi p{font-size:17px;line-height:1.6;font-weight:500;color:#1d1d1f;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  .pi .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px}
  .pi .who b{font-family:'Nanum Pen Script',cursive;font-weight:400;font-size:26px;line-height:1;color:#2b2b2e}
  .pi .who small{font-size:12px;color:rgba(0,0,0,.45);white-space:nowrap}
  .pi .more{display:block;margin-top:6px;font-size:13px;font-weight:700;color:rgba(0,0,0,.5)}

  /* 사진 모음 */
  .photos{width:min(1200px,100%);margin:0 auto;padding:0 24px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .ph{position:relative;aspect-ratio:1/1;border:0;padding:0;border-radius:18px;overflow:hidden;cursor:zoom-in;background:#ecebe6}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
  .ph:hover img{transform:scale(1.05)}
  .ph span{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:13px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--mute);font-size:17px;padding:20px 0}

  /* 마지막 */
  .close{min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px;border-top:1px solid var(--line)}
  .close h2{font-size:clamp(40px,7vw,80px);font-weight:800;letter-spacing:-.05em;line-height:1.1}
  .close p{margin-top:20px;font-size:clamp(17px,2vw,21px);color:var(--mute);line-height:1.7}
  .close .sign{margin-top:36px;font-family:'Nanum Pen Script',cursive;font-size:40px;color:var(--ink-2)}
  .close .names{margin-top:14px;max-width:680px;font-family:'Nanum Pen Script',cursive;font-size:26px;color:var(--mute);line-height:1.5}
  .home{display:inline-block;margin-top:30px;font-size:15px;color:#0066cc;text-decoration:none}

  /* 크게 보기 */
  .viewer{position:fixed;inset:0;z-index:50;background:rgba(24,22,18,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:70px 76px}
  .viewer.open{display:flex}
  .card{position:relative;width:min(680px,100%);max-height:100%;overflow:auto;padding:46px 46px 34px;border-radius:6px 6px 30px 6px;color:#1d1d1f;box-shadow:0 40px 90px rgba(0,0,0,.4);animation:zoomin .45s var(--ease)}
  @keyframes zoomin{from{opacity:0;transform:scale(.9) rotate(-1.5deg)}}
  .card p{font-size:clamp(22px,3vw,30px);line-height:1.65;font-weight:600;letter-spacing:-.025em;white-space:pre-wrap;overflow-wrap:anywhere}
  .card p.long{font-size:clamp(19px,2.4vw,24px);line-height:1.75;font-weight:500}
  .card .who{margin-top:30px;font-family:'Nanum Pen Script',cursive;font-size:38px;line-height:1;color:#2b2b2e}
  .card .who small{display:block;font-family:'Pretendard Variable',sans-serif;font-size:14px;color:rgba(0,0,0,.45);margin-top:10px}
  .pic{max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;animation:zoomin .45s var(--ease)}
  .pic img{max-width:100%;max-height:calc(100svh - 190px);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:block}
  .pic figcaption{margin-top:14px;color:#fff;font-size:18px;font-weight:600;text-align:center}
  .pic figcaption span{display:block;font-size:14px;color:rgba(255,255,255,.7);font-weight:500;margin-top:4px}
  .vbtn{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer}
  .vbtn:hover{background:rgba(255,255,255,.3)}
  .vx{top:16px;right:16px}.vp{left:16px;top:50%;transform:translateY(-50%)}.vn{right:16px;top:50%;transform:translateY(-50%)}
  .vbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.85);font-size:14px;font-weight:600}
  .vbar button{border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .vprog{position:absolute;left:0;top:0;height:3px;background:#fff;width:0}
  @media (max-width:640px){ .viewer{padding:64px 14px 70px} .card{padding:32px 26px 26px} .vp,.vn{top:auto;bottom:10px;transform:none} .vp{left:14px} .vn{right:14px} }

  /* 봉투 */
  .gate{position:fixed;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 40%,#2a241c 0%,#14110d 70%);color:#f3ede2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1.6s var(--ease),visibility 1.6s}
  .gate.gone{opacity:0;visibility:hidden}
  .gate .to{font-size:15px;letter-spacing:.02em;color:#b9ae9c;opacity:0;animation:fadein 1.2s .3s var(--ease) forwards}
  .gate .to b{color:#f3ede2;font-weight:700}
  .env{position:relative;width:min(340px,78vw);aspect-ratio:3/2;margin:34px 0 30px;perspective:900px;opacity:0;animation:rise 1.4s .6s var(--ease) forwards;cursor:pointer;border:0;background:none}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  @keyframes fadein{to{opacity:1}}
  .env .back{position:absolute;inset:0;background:#e9dfcc;border-radius:8px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
  .env .paper{position:absolute;left:7%;right:7%;top:10%;bottom:8%;background:#fffdf7;border-radius:4px;transition:transform 1.4s .5s var(--ease);display:flex;align-items:flex-start;justify-content:center;padding-top:12%;font-family:'Nanum Pen Script',cursive;font-size:30px;color:#3a3226}
  .env .front{position:absolute;inset:0;background:linear-gradient(#efe6d4,#e6dac3);border-radius:8px;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
  .env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:linear-gradient(#ddd0b6,#e6dac3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .9s var(--ease);z-index:3}
  .env .seal{position:absolute;left:50%;top:44%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9534a,#9c2a22);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:26px;z-index:4;transition:opacity .4s,transform .4s}
  .env.opened .seal{opacity:0;transform:scale(1.4)}
  .env.opened .flap{transform:rotateX(180deg);z-index:1}
  .env.opened .paper{transform:translateY(-62%)}
  .gate .tap{border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:700;background:#f3ede2;color:#1d1d1f;cursor:pointer;opacity:0;animation:fadein 1.2s 1.6s var(--ease) forwards}
  .gate .quiet{margin-top:14px;border:0;background:none;color:#8f8676;font-size:14px;cursor:pointer;opacity:0;animation:fadein 1.2s 2s var(--ease) forwards}
  .gate .story{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;pointer-events:none}
  .gate .line{position:absolute;max-width:22em;font-size:clamp(24px,3.6vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.4;opacity:0;filter:blur(8px);transform:translateY(12px);transition:opacity 1.5s var(--ease),filter 1.5s var(--ease),transform 1.5s var(--ease)}
  .gate .line.in{opacity:1;filter:none;transform:none}
  .gate .line.out{opacity:0;filter:blur(8px);transform:translateY(-12px)}
  .gate .skip{position:absolute;right:20px;bottom:20px;border:0;background:none;color:#8f8676;font-size:14px;cursor:pointer;display:none}
  .gate.telling .env,.gate.telling .to,.gate.telling .tap,.gate.telling .quiet{opacity:0!important;transition:opacity .9s;animation:none;pointer-events:none}

  /* 크게 보기: 문장이 차례로 떠오름 */
  .card p .s{opacity:0;transition:opacity 1.1s var(--ease)}
  .card p .s.in{opacity:1}

  /* 엔딩 크레딧 */
  .credits{position:relative;width:100%;max-width:640px;height:46svh;margin-top:34px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
  .credits .roll{position:absolute;left:0;right:0;top:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
  .credits.go .roll{animation:roll var(--dur,30s) linear forwards}
  @keyframes roll{to{transform:translateY(calc(-100% - 46svh))}}
  .credits .role{font-size:13px;letter-spacing:.12em;color:var(--mute);margin-top:18px}
  .credits .nm{font-family:'Nanum Pen Script',cursive;font-size:34px;color:var(--ink-2);line-height:1.1}
  .credits .anon{font-size:16px;color:var(--mute)}
  .final{margin-top:30px;opacity:0;transition:opacity 2s var(--ease)}
  .final.in{opacity:1}
  .final b{display:block;font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.04em}
  .final span{display:block;font-size:44px;margin-top:10px}

  .bgm{position:fixed;left:18px;bottom:18px;z-index:40;border:0;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;background:rgba(29,29,31,.85);color:#fff;cursor:pointer}
  @media (prefers-reduced-motion: reduce){ .gate .line{transition:none} .credits.go .roll{animation-duration:1ms} .pi{opacity:1;translate:none} .intro .seq{opacity:1;transform:none;transition:none} .card,.pic{animation:none} html{scroll-behavior:auto} }

  /* "포스트잇을 보실래요?" 시작 화면 */
  .ask{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#f3ede2;
    background:radial-gradient(ellipse at 50% 45%,#2a241c 0%,#15120e 62%,#0d0b08 100%);transition:opacity 2.4s var(--ease),visibility 2.4s}
  .ask.gone{opacity:0;visibility:hidden}
  .ask .glow{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%) scale(.2);border-radius:50%;
    background:radial-gradient(circle,#fff8ea 0%,rgba(255,236,205,.85) 18%,rgba(255,220,170,.25) 40%,transparent 62%);opacity:0;transition:transform 2.8s var(--ease),opacity 1.6s var(--ease);pointer-events:none}
  .ask.dawn .glow{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  .ask .m{font-size:40px;line-height:1;opacity:0;animation:askIn 1.4s .2s var(--ease) forwards}
  .ask .q1{margin-top:22px;font-size:clamp(17px,2.2vw,22px);color:#cbbfa9;line-height:1.6;opacity:0;animation:askIn 1.4s .7s var(--ease) forwards}
  .ask .q1 b{color:#fff3df;font-weight:800}
  .ask .q2{margin-top:10px;font-size:clamp(44px,7vw,84px);font-weight:800;letter-spacing:-.05em;line-height:1.1;color:#fff8ec;opacity:0;animation:askIn 1.6s 1.6s var(--ease) forwards}
  .ask .acts{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:38px;opacity:0;animation:askIn 1.2s 2.6s var(--ease) forwards}
  .ask .yes{border:0;border-radius:999px;padding:16px 32px;font-size:18px;font-weight:800;background:#fff3df;color:#2a2117;cursor:pointer;box-shadow:0 0 0 0 rgba(255,243,223,.5);animation:breathe 2.6s 3.8s ease-in-out infinite}
  @keyframes breathe{50%{box-shadow:0 0 0 14px rgba(255,243,223,0)}}
  .ask .quiet{border:0;background:none;color:#8f8676;font-size:14px;cursor:pointer}
  .ask .say{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:clamp(24px,3.6vw,38px);font-weight:700;letter-spacing:-.03em;color:#3a2f22;opacity:0;transition:opacity 1.4s var(--ease);pointer-events:none;z-index:2;padding:0 24px}
  .ask .say.in{opacity:1}
  .ask.dawn .m,.ask.dawn .q1,.ask.dawn .q2,.ask.dawn .acts{opacity:0!important;transition:opacity .9s;animation:none}
  @keyframes askIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  /* 포스트잇이 하나씩 내려와 붙음 */
  .pi{transform-origin:50% 0}
  .pi.drop{animation:land 1.1s cubic-bezier(.2,.9,.25,1.05) both}
  @keyframes land{0%{opacity:0;translate:0 -60px;rotate:-6deg;scale:1.06}60%{opacity:1}100%{opacity:1;translate:0 0;rotate:0deg;scale:1}}
  .ph{opacity:0;transform:scale(.94);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
  .ph.in{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){ .ask .m,.ask .q1,.ask .q2,.ask .acts{animation:none;opacity:1} .pi.drop{animation:none;opacity:1;translate:none} .ph{opacity:1;transform:none} }
</style>
</head>
<body>

<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askQ">
  <div class="glow"></div>
  <div class="m" aria-hidden="true">🍈</div>
  <p class="q1">멜론님, 동료들이 남긴<br>포스트잇이 <b id="askN">가득</b> 있어요.</p>
  <h2 class="q2" id="askQ">보실래요?</h2>
  <div class="acts"><button class="yes" id="askYes">네, 볼래요 ♪</button><button class="quiet" id="askQuiet">소리 없이 볼게요</button></div>
  <div class="say" id="askSay">천천히 읽어보세요.</div>
</div>

<section class="intro">
  <div class="m seq">🍈</div>
  <h1 class="seq">멜론님께.</h1>
  <p class="seq">1,412일 동안 함께한 동료 <b id="cntPeople">0명</b>이<br>마음 <b id="cntNotes">0장</b>과 사진 <b id="cntPhotos">0장</b>을 남겼어요.</p>
  <div class="acts seq"><button class="btn" id="play">한 장씩 천천히 읽기 ▶</button></div>
</section>

<div class="head" id="wallHead"><h2>남겨진 마음.</h2><span>포스트잇을 누르면 크게 볼 수 있어요.</span></div>
<main class="wall" id="wall"></main>

<div class="head" id="photoHead"><h2>함께한 장면.</h2><span>사진을 누르면 크게 볼 수 있어요.</span></div>
<section class="photos" id="photos"></section>

<section class="close" id="end">
  <h2>그동안 정말<br>고마웠어요.</h2>
  <p>어디서든 지금처럼 웃으며 일하시길.<br>가끔은 이 페이지에 다시 들러주세요.</p>
  <div class="sign">2026년 11월 20일, 동료 일동</div>
  <div class="credits" id="credits"><div class="roll" id="roll"></div></div>
  <div class="final" id="final"><b>고마웠어요, 멜론님.</b><span>🍈</span></div>
  <div class="names" id="names" hidden></div>
  <a class="home" href="../">전체 페이지 둘러보기</a>
</section>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="크게 보기">
  <div class="vprog" id="vprog"></div>
  <div id="vbody"></div>
  <button class="vbtn vx" id="vx" aria-label="닫기">✕</button>
  <button class="vbtn vp" id="vp" aria-label="이전">‹</button>
  <button class="vbtn vn" id="vn" aria-label="다음">›</button>
  <div class="vbar"><span id="vcount"></span><button id="vplay">자동 넘기기 ▶</button></div>
</div>

<button class="bgm" id="bgm">♪ 음악 켜기</button>

<script>
const $ = id => document.getElementById(id);
const SUPABASE_URL = 'https://mtxzrcaixncoedxymzjp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fNrLK8o8hgja9leQKo4KAw_K4ntHTq5';
const COLORS = ['#fff1a8','#ffd6e0','#cdf2d6','#d4e8ff','#ffe0bf'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtDate = s => { const d = new Date(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const colorOf = n => COLORS.includes(n.color) ? n.color : COLORS[n.id % COLORS.length];
let NOTES = [], PHOTOS = [], photoUrl = () => '';
let seq = [], cur = 0, auto = null;   // 크게 보기에서 넘길 순서: 포스트잇 → 사진

// 시작 화면
function introIn(){ document.querySelectorAll('.intro .seq').forEach((el, i) => setTimeout(() => el.classList.add('in'), REDUCED ? 0 : 300 + i * 600)); }

// ===== 그리기 =====
function build(){
  const wall = $('wall'); wall.innerHTML = '';
  if (!NOTES.length){ const e = document.createElement('p'); e.className = 'empty'; e.textContent = '아직 남겨진 포스트잇이 없어요.'; wall.appendChild(e); }
  NOTES.forEach((n, i) => {
    const b = document.createElement('button'); b.className = 'pi'; b.style.background = colorOf(n);
    b.style.transform = `rotate(${((n.id % 5) - 2) * .7}deg)`;
    b.setAttribute('aria-label', (n.author || '익명의 동료') + '의 포스트잇 크게 보기');
    const text = String(n.text || '');
    const p = document.createElement('p'); p.textContent = text;
    const w = document.createElement('div'); w.className = 'who';
    const a = document.createElement('b'); a.textContent = n.author || '익명의 동료';
    const d = document.createElement('small'); d.textContent = fmtDate(n.created_at);
    w.append(a, d); b.append(p);
    if (text.length > 120){ const m = document.createElement('span'); m.className = 'more'; m.textContent = '더 읽기'; b.append(m); }
    b.append(w);
    b.onclick = () => openAt(i);
    wall.appendChild(b);
  });
  const ph = $('photos'); ph.innerHTML = '';
  $('photoHead').style.display = PHOTOS.length ? '' : 'none'; ph.style.display = PHOTOS.length ? '' : 'none';
  PHOTOS.forEach((x, i) => {
    const b = document.createElement('button'); b.className = 'ph'; b.setAttribute('aria-label', (x.caption || '사진') + ' 크게 보기');
    const img = document.createElement('img'); img.loading = 'lazy'; img.alt = ''; img.src = photoUrl(x.path); b.appendChild(img);
    if (x.caption){ const c = document.createElement('span'); c.textContent = x.caption; b.appendChild(c); }
    b.onclick = () => openAt(NOTES.length + i);
    ph.appendChild(b);
  });
  seq = [...NOTES.map(n => ({ kind: 'note', n })), ...PHOTOS.map(p => ({ kind: 'photo', p }))];
  const people = new Set(); let anon = 0;
  NOTES.forEach(n => { const a = (n.author || '').trim(); if (a) people.add(a); else anon++; });
  PHOTOS.forEach(p => { const a = (p.author || '').trim(); if (a) people.add(a); });
  $('cntPeople').textContent = (people.size + anon) + '명';
  $('cntNotes').textContent = NOTES.length + '장';
  $('cntPhotos').textContent = PHOTOS.length + '장';
  $('names').textContent = [...people].join(' · ') + (anon ? `  그리고 이름 없이 마음을 남긴 ${anon}명` : '');
  const roll = $('roll'); roll.innerHTML = '';
  const addRole = t => { const d = document.createElement('div'); d.className = 'role'; d.textContent = t; roll.appendChild(d); };
  const addName = (t, cls) => { const d = document.createElement('div'); d.className = cls || 'nm'; d.textContent = t; roll.appendChild(d); };
  addRole('마음을 남긴 동료들');
  [...people].forEach(nm => addName(nm));
  if (anon) addName(`그리고 이름 없이 마음을 남긴 ${anon}명`, 'anon');
  addRole('함께한 시간'); addName('1,412일');
  addRole('주연'); addName('멜론');
  $('credits').style.setProperty('--dur', Math.max(18, 10 + people.size * 1.6) + 's');
  startedCredits = false;
  $('askN').textContent = NOTES.length ? NOTES.length + '장' : '가득';
  dataReady = true; if (opened) revealAll();
}

// ===== 크게 보기 =====
function render(){
  const it = seq[cur], body = $('vbody'); body.innerHTML = '';
  if (it.kind === 'note'){
    const n = it.n, text = String(n.text || '');
    const c = document.createElement('article'); c.className = 'card'; c.style.background = colorOf(n);
    const p = document.createElement('p'); if (text.length > 80) p.className = 'long';
    const parts = text.match(/[^.!?。…\n]+[.!?。…]*\s*|\n/g) || [text];
    parts.forEach((t, i) => { const sp = document.createElement('span'); sp.className = 's'; sp.textContent = t; p.appendChild(sp); setTimeout(() => sp.classList.add('in'), REDUCED ? 0 : 150 + i * 420); });
    const w = document.createElement('div'); w.className = 'who'; w.textContent = '— ' + (n.author || '익명의 동료');
    w.style.opacity = 0; w.style.transition = 'opacity 1.2s'; setTimeout(() => { w.style.opacity = 1; }, REDUCED ? 0 : 300 + parts.length * 420);
    const s = document.createElement('small'); s.textContent = fmtDate(n.created_at); w.appendChild(s);
    c.append(p, w); body.appendChild(c);
  } else {
    const x = it.p;
    const f = document.createElement('figure'); f.className = 'pic';
    const img = document.createElement('img'); img.src = photoUrl(x.path); img.alt = x.caption || '함께한 사진';
    const cap = document.createElement('figcaption'); cap.textContent = x.caption || '';
    const by = document.createElement('span'); by.textContent = '📷 ' + (x.author || '익명의 동료'); cap.appendChild(by);
    f.append(img, cap); body.appendChild(f);
  }
  $('vcount').textContent = `${cur + 1} / ${seq.length}`;
  // 다음 사진 미리 불러오기
  const nx = seq[cur + 1]; if (nx && nx.kind === 'photo'){ const pre = new Image(); pre.src = photoUrl(nx.p.path); }
}
function openAt(i){ if (!seq.length) return; cur = (i + seq.length) % seq.length; render(); $('viewer').classList.add('open'); document.body.style.overflow = 'hidden'; $('vx').focus(); }
function closeV(){ stopAuto(); $('viewer').classList.remove('open'); document.body.style.overflow = ''; }
function go(d){ cur = (cur + d + seq.length) % seq.length; render(); if (auto) schedule(); }
$('vx').onclick = closeV; $('vp').onclick = () => { stopAuto(); go(-1); }; $('vn').onclick = () => { stopAuto(); go(1); };
$('viewer').addEventListener('click', e => { if (e.target.id === 'viewer' || e.target.id === 'vbody') closeV(); });
document.addEventListener('keydown', e => {
  if (!$('viewer').classList.contains('open')) return;
  if (e.key === 'Escape') closeV(); else if (e.key === 'ArrowLeft'){ stopAuto(); go(-1); } else if (e.key === 'ArrowRight'){ stopAuto(); go(1); }
});
// 휴대폰에서 좌우로 밀어서 넘기기
let tx = null;
$('viewer').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('viewer').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50){ stopAuto(); go(dx < 0 ? 1 : -1); } tx = null; });

// 자동 넘기기: 글이 길면 더 오래 머묾
function dwell(){ const it = seq[cur]; return it.kind === 'note' ? Math.min(14000, 4000 + String(it.n.text || '').length * 55) : 6000; }
function schedule(){
  clearTimeout(auto); const ms = dwell(); const bar = $('vprog');
  bar.style.transition = 'none'; bar.style.width = '0'; requestAnimationFrame(() => { bar.style.transition = `width ${ms}ms linear`; bar.style.width = '100%'; });
  auto = setTimeout(() => { if (cur >= seq.length - 1){ stopAuto(); closeV(); $('end').scrollIntoView({ behavior: 'smooth' }); return; } go(1); }, ms);
}
function startAuto(){ $('vplay').textContent = '일시정지 ❚❚'; schedule(); }
function stopAuto(){ clearTimeout(auto); auto = null; $('vplay').textContent = '자동 넘기기 ▶'; const bar = $('vprog'); bar.style.transition = 'none'; bar.style.width = '0'; }
$('vplay').onclick = () => { if (auto) stopAuto(); else { auto = 1; startAuto(); } };
$('play').onclick = () => { if (audio.paused) audio.play().catch(() => {}); openAt(0); auto = 1; startAuto(); };

// ===== 배경음악 =====
const audio = new Audio('letters-bgm.mp3'); audio.loop = true; audio.volume = .7; audio.preload = 'auto';
function bgmUI(){ $('bgm').textContent = audio.paused ? '♪ 음악 켜기' : '♪ 음악 끄기'; }
$('bgm').onclick = () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
audio.addEventListener('play', bgmUI); audio.addEventListener('pause', bgmUI);

// ===== 엔딩 크레딧 =====
let startedCredits = false;
new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting || startedCredits || !seq.length) return; startedCredits = true;
  const c = $('credits'); c.classList.remove('go'); void c.offsetWidth; c.classList.add('go');
  const dur = parseFloat(getComputedStyle(c).getPropertyValue('--dur')) || 30;
  setTimeout(() => $('final').classList.add('in'), REDUCED ? 0 : dur * 1000 - 1500);
}), { threshold: .5 }).observe($('end'));

// ===== "포스트잇을 보실래요?" → 노래와 함께 하나씩 =====
let opened = false, dataReady = false, revealed = false, following = false;
function revealAll(){
  if (revealed) return; revealed = true;
  const notes = [...document.querySelectorAll('.pi')], pics = [...document.querySelectorAll('.ph')];
  // 전체 약 18초 안에 모두 붙도록 간격 조절
  const gap = REDUCED ? 0 : Math.max(140, Math.min(650, 16000 / Math.max(1, notes.length)));
  notes.forEach((el, i) => setTimeout(() => { el.classList.add('in', 'drop'); if (following) follow(el); }, i * gap));
  const after = notes.length * gap + 600;
  pics.forEach((el, i) => setTimeout(() => { el.classList.add('in'); if (following && i % 4 === 0) follow(el); }, after + i * (REDUCED ? 0 : 180)));
  setTimeout(() => { following = false; }, after + pics.length * 180 + 1500);
}
// 새로 붙은 포스트잇이 화면 아래로 벗어나면 천천히 따라 내려감
function follow(el){
  const r = el.getBoundingClientRect();
  if (r.bottom > innerHeight * .9) window.scrollBy({ top: r.bottom - innerHeight * .7, behavior: 'smooth' });
}
['wheel', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => { following = false; }, { passive: true }));

function openWall(withSound){
  if (opened) return; opened = true;
  if (withSound){ audio.volume = 0; audio.play().catch(() => {}); const t0 = performance.now(); const up = now => { const k = Math.min(1, (now - t0) / 3000); audio.volume = .7 * k; if (k < 1) requestAnimationFrame(up); }; requestAnimationFrame(up); }
  const ask = $('ask');
  ask.classList.add('dawn');                                       // 새벽처럼 밝아짐
  setTimeout(() => $('askSay').classList.add('in'), REDUCED ? 0 : 1400);
  setTimeout(() => {
    ask.classList.add('gone'); document.body.style.overflow = ''; introIn();
    setTimeout(() => {
      following = true;
      document.getElementById('wallHead').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
      setTimeout(() => { if (dataReady) revealAll(); }, REDUCED ? 0 : 1200);
    }, REDUCED ? 0 : 2600);
  }, REDUCED ? 0 : 3200);
}
document.body.style.overflow = 'hidden';
$('askYes').onclick = () => openWall(true);
$('askQuiet').onclick = () => openWall(false);

// ===== 데이터 =====
(async () => {
  let sb = null; try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}
  if (!sb){ $('wall').innerHTML = '<p class="empty">포스트잇을 불러오지 못했어요. 새로고침해 주세요.</p>'; return; }
  photoUrl = path => sb.storage.from('gallery').getPublicUrl(path).data.publicUrl;
  const [n, p] = await Promise.all([
    sb.from('notes').select('*').order('created_at', { ascending: true }).limit(500),
    sb.from('photos').select('*').order('created_at', { ascending: true }).limit(300),
  ]);
  if (n.error) console.error(n.error); if (p.error) console.error(p.error);
  NOTES = n.data || []; PHOTOS = p.data || [];
  build();
})();
</script>
</body>
</html>
